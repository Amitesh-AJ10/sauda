[project]
name = "sauda-backend"
version = "0.1.0"
description = "Sauda backend: FastAPI + LangGraph agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
